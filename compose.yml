# Development stack. `docker compose up db` alone is enough when running api/web locally.
name: autopoint

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-autopoint}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autopoint}
      POSTGRES_DB: ${POSTGRES_DB:-autopoint}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: apps/api
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-autopoint}:${POSTGRES_PASSWORD:-autopoint}@db:5432/${POSTGRES_DB:-autopoint}
      CORS_ORIGINS: '["http://localhost:3000"]'
      PUBLIC_URL: ${SITE_URL:-http://localhost:3000}
      MEDIA_ROOT: /data/media
    volumes:
      - media:/data/media
    # Dev stack only: apply migrations and load demo content (skipped if already configured).
    command: ["sh", "-c", "alembic upgrade head && python -m app.seed && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Delivers the notification outbox to Telegram (and housekeeping). Without
  # TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID it runs but leaves notifications queued.
  worker:
    build: apps/api
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-autopoint}:${POSTGRES_PASSWORD:-autopoint}@db:5432/${POSTGRES_DB:-autopoint}
      PUBLIC_URL: ${SITE_URL:-http://localhost:3000}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    depends_on:
      api:
        condition: service_healthy  # migrations have run

  web:
    build: apps/web
    environment:
      API_INTERNAL_URL: http://api:8000
      SITE_URL: ${SITE_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  media:
